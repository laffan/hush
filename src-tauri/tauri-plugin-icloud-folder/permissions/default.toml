"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-pick-folder"
description = "Allow JS to present the iOS folder picker and mint a security-scoped bookmark."
commands.allow = ["pick_folder"]

[[permission]]
identifier = "allow-resolve-bookmark"
description = "Allow JS to resolve a persisted bookmark and re-acquire security-scoped access."
commands.allow = ["resolve_bookmark"]

[[permission]]
identifier = "allow-stop-access"
description = "Allow JS to relinquish security-scoped access to a previously resolved folder."
commands.allow = ["stop_access"]

[[permission]]
identifier = "allow-list-dir"
description = "Allow JS to list the contents of a security-scoped folder."
commands.allow = ["list_dir"]

[[permission]]
identifier = "allow-read-file"
description = "Allow JS to read a file inside a security-scoped folder."
commands.allow = ["read_file"]

[[permission]]
identifier = "allow-write-file"
description = "Allow JS to write a file inside a security-scoped folder."
commands.allow = ["write_file"]

[default]
description = "Default permissions: allow the full folder-bookmark demo flow (pick, resolve, list, read, write, stop)."
permissions = [
  "allow-pick-folder",
  "allow-resolve-bookmark",
  "allow-stop-access",
  "allow-list-dir",
  "allow-read-file",
  "allow-write-file",
]
