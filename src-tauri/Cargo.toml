[package]
name = "hush"
version = "0.1.0"
edition = "2021"

[lib]
name = "hush_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
notify = { version = "6", features = ["macos_fsevent"] }
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
harper-core = { version = "2", default-features = false }
tauri-plugin-pencil = { path = "tauri-plugin-pencil" }
tauri-plugin-ipad-window = { path = "tauri-plugin-ipad-window" }

# Typst-backed PDF export pipeline (docs + projects). The compiler runs
# in-process so the same code path serves desktop builds and the iOS
# bundle — neither shells out to a CLI nor reaches the network.
typst = "0.14"
typst-pdf = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
pulldown-cmark = { version = "0.13", default-features = false }
hayagriva = "0.9"
comemo = "0.5"
ecow = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[dev-dependencies]
tempfile = "3"
