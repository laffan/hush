[package]
name = "tauri-plugin-pencil"
version = "0.1.0"
description = "Apple Pencil & touch-type detection for Tauri iOS"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-pencil"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
