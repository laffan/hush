[package]
name = "tauri-plugin-hush-widgets"
version = "0.1.0"
description = "Hands Hush's home screen widget snapshot to WidgetKit on iOS (App Group container + timeline reload)"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-hush-widgets"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
