<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Pen Tool Demo · Stamped</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="toolbar" aria-label="Tools">
    <div class="tool-group">
      <button type="button" class="tool" data-tool="draw" aria-label="Draw" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 21l3.2-.8L20 6.4 17.6 4 4 17.8 3 21z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          <path d="M14.8 6.8l2.4 2.4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="tool" data-tool="erase" aria-label="Erase" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 3.5l5 5L10 19H5v-5L15.5 3.5z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          <path d="M12 7l5 5" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <path d="M4 21h16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="tool" data-tool="slice" aria-label="Slice" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="6" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8.3 8.6 L20 19 M8.3 15.4 L20 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="tool" data-tool="select" aria-label="Select" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-dasharray="3 2"/>
        </svg>
      </button>
    </div>

    <div class="tool-group brush-slots" role="radiogroup" aria-label="Brush slot">
      <button type="button" class="brush-slot" data-slot="0" aria-pressed="true" aria-label="Brush slot 1">
        <canvas class="brush-thumb" width="56" height="56" aria-hidden="true"></canvas>
      </button>
      <button type="button" class="brush-slot" data-slot="1" aria-pressed="false" aria-label="Brush slot 2">
        <canvas class="brush-thumb" width="56" height="56" aria-hidden="true"></canvas>
      </button>
      <button type="button" class="brush-slot" data-slot="2" aria-pressed="false" aria-label="Brush slot 3">
        <canvas class="brush-thumb" width="56" height="56" aria-hidden="true"></canvas>
      </button>
      <button type="button" class="brush-slot" data-slot="3" aria-pressed="false" aria-label="Brush slot 4">
        <canvas class="brush-thumb" width="56" height="56" aria-hidden="true"></canvas>
      </button>
    </div>

    <div class="tool-group">
      <button type="button" id="layersBtn" class="tool" aria-label="Layers" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 L21 8 L12 13 L3 8 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          <path d="M3 12 L12 17 L21 12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          <path d="M3 16 L12 21 L21 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="tool-group">
      <button type="button" id="clear" class="tool" aria-label="Clear all">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </aside>

  <aside
    id="eraserPanel"
    class="options-panel options-panel--mini"
    aria-label="Eraser options"
    aria-hidden="true"
  >
    <div class="panel-section">
      <div class="panel-section-title">Eraser</div>
      <div class="panel-row">
        <label class="panel-label" for="eraserSize">Thickness</label>
        <input id="eraserSize" type="range" min="2" max="80" step="1" value="16" aria-label="Eraser thickness" />
        <div class="panel-value" id="eraserSizeVal">16</div>
      </div>
    </div>
  </aside>

  <aside
    id="layersPanel"
    class="options-panel options-panel--layers"
    aria-label="Layers"
    aria-hidden="true"
  >
    <div class="panel-section">
      <div class="panel-section-title panel-section-title--row">
        <span>Layers</span>
        <button type="button" id="layersAdd" class="layer-add-btn" aria-label="Add layer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="layerList" class="layer-list" role="list"></div>
    </div>
  </aside>

  <aside
    id="brushPanel"
    class="options-panel"
    aria-label="Brush options"
    aria-hidden="true"
  >
    <div class="panel-section">
      <div class="panel-section-title">Pen</div>
      <div class="panel-row">
        <label class="panel-label" for="size">Size</label>
        <input id="size" type="range" min="1" max="48" step="1" value="4" aria-label="Pen size" />
        <div class="panel-value" id="sizeVal">4</div>
      </div>
      <div class="panel-row">
        <label class="panel-label" for="stream">Stream</label>
        <input id="stream" type="range" min="0" max="100" step="1" value="35" aria-label="Streamline" />
        <div class="panel-value" id="streamVal">35</div>
      </div>
      <div class="panel-row">
        <label class="panel-label" for="smooth">Smooth</label>
        <input id="smooth" type="range" min="0" max="100" step="1" value="100" aria-label="Smoothing" />
        <div class="panel-value" id="smoothVal">100</div>
      </div>
      <div class="panel-row">
        <label class="panel-label" for="spacing">Spacing</label>
        <input id="spacing" type="range" min="5" max="50" step="1" value="12" aria-label="Stamp spacing" />
        <div class="panel-value" id="spacingVal">12</div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Brush</div>
      <div id="brushGrid" class="brush-grid" role="radiogroup" aria-label="Brush style"></div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Color</div>
      <div class="swatch-grid" role="radiogroup" aria-label="Color">
        <button type="button" class="swatch" data-color="#111111" aria-label="Black" style="--c:#111111" aria-checked="true"></button>
        <button type="button" class="swatch" data-color="#e11d48" aria-label="Red" style="--c:#e11d48"></button>
        <button type="button" class="swatch" data-color="#f59e0b" aria-label="Orange" style="--c:#f59e0b"></button>
        <button type="button" class="swatch" data-color="#16a34a" aria-label="Green" style="--c:#16a34a"></button>
        <button type="button" class="swatch" data-color="#2563eb" aria-label="Blue" style="--c:#2563eb"></button>
        <button type="button" class="swatch" data-color="#7c3aed" aria-label="Purple" style="--c:#7c3aed"></button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Mode</div>
      <button type="button" id="highlighterToggle" class="mode-toggle" role="switch" aria-checked="false">
        <span class="mode-toggle-track"><span class="mode-toggle-thumb"></span></span>
        <span class="mode-toggle-label">Highlighter</span>
      </button>
    </div>
  </aside>

  <main class="stage">
    <canvas id="done" class="draw-canvas"></canvas>
    <canvas id="preview" class="draw-canvas"></canvas>
    <canvas id="live" class="draw-canvas"></canvas>
    <svg
      id="canvas"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="xMidYMid meet"
    >
      <circle id="eraserCursor" r="12" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 3" visibility="hidden" pointer-events="none"/>
      <g id="selectionLayer"></g>
    </svg>
    <div id="longPressHint" class="long-press-hint" aria-hidden="true">Select</div>
    <nav class="version-nav" aria-label="Renderer version">
      <a href="../pure-svg/index.html">&larr; Pure SVG</a>
      <span class="version-nav-active">Stamped</span>
    </nav>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
