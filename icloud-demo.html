<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>iCloud Folder Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: #16181d; color: #e6e8ee;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .wrap { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 64px; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    h2 { font-size: 15px; margin: 0 0 8px; color: #aeb4c2; text-transform: uppercase; letter-spacing: .04em; }
    .sub { color: #9aa1b2; margin: 0 0 16px; }
    .hint { color: #8a90a0; font-size: 13px; margin: 0 0 8px; }
    code { background: #23262e; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    section { background: #1d2027; border: 1px solid #2a2e38; border-radius: 12px;
      padding: 14px 16px; margin: 12px 0; }
    button { appearance: none; border: 0; border-radius: 9px; padding: 11px 16px;
      font-size: 15px; font-weight: 600; background: #3b82f6; color: #fff; cursor: pointer;
      margin: 2px 6px 2px 0; }
    button:active { transform: translateY(1px); }
    button.ghost { background: #2a2e38; color: #cdd2dd; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    textarea { width: 100%; background: #14161b; color: #e6e8ee; border: 1px solid #2a2e38;
      border-radius: 9px; padding: 10px; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: vertical; }
    .box { background: #14161b; border: 1px solid #2a2e38; border-radius: 9px; padding: 10px;
      white-space: pre-wrap; word-break: break-word; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cdd2dd; margin: 8px 0 0; max-height: 220px; overflow: auto; }
    .box.log { min-height: 80px; }
    .log-line.ok { color: #5fd28a; }
    .log-line.warn { color: #e6c15f; }
    .log-line.err { color: #f0786e; }
    .savestate { color: #8a90a0; font-size: 13px; }
    .status { border-radius: 9px; padding: 10px 12px; font-weight: 600; margin: 0 0 8px; }
    .status.idle { background: #23262e; color: #aeb4c2; }
    .status.ok { background: #14361f; color: #6fe39a; }
    .status.warn { background: #3a3216; color: #f0d27a; }
    .status.err { background: #3a1a18; color: #f5938a; }
    ul#checklist { list-style: none; padding: 0; margin: 0; }
    ul#checklist li { padding: 4px 0; font-size: 14px; }
    ul#checklist li.ok { color: #6fe39a; }
    ul#checklist li.pending { color: #8a90a0; }
  </style>
</head>
<body>
  <div id="icloud-demo-root"></div>
  <script type="module" src="/src/icloud-demo/icloud-demo.js"></script>
</body>
</html>
