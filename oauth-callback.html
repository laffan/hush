<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hush — Authorization</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .card {
      text-align: center;
      padding: 40px;
      border-radius: 12px;
      background: #16213e;
      max-width: 400px;
    }
    h1 { font-size: 1.4em; margin: 0 0 12px; }
    p { opacity: 0.7; margin: 0; line-height: 1.5; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Connecting...</h1>
    <p id="message">Please wait while we complete the authorization.</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code");
    var error = params.get("error");
    // Dropbox-only — Google OAuth uses a Rust-side loopback HTTP
    // listener that intercepts the redirect directly. This page only
    // sees Dropbox callbacks now.
    var titleEl = document.getElementById("title");
    var msgEl = document.getElementById("message");

    if (error) {
      titleEl.textContent = "Authorization Failed";
      msgEl.textContent = error === "access_denied"
        ? "You declined the Dropbox authorization. You can close this window."
        : "Error: " + error + ". You can close this window.";
      msgEl.classList.add("error");
    } else if (code) {
      // Relay the code to the Hush app via the custom URL scheme.
      // This triggers the Tauri deep-link handler which emits an event
      // that the settings window is listening for.
      titleEl.textContent = "Connected!";
      msgEl.textContent = "Returning to Hush...";
      window.location.href = "hushwriter://auth/callback?code=" + encodeURIComponent(code);

      // If the redirect doesn't work (scheme not registered), show fallback
      setTimeout(function() {
        msgEl.textContent = "You can close this window and return to Hush.";
      }, 2000);
    } else {
      titleEl.textContent = "No Authorization Code";
      msgEl.textContent = "Something went wrong. Please try again from Hush settings.";
      msgEl.classList.add("error");
    }
  </script>
</body>
</html>
