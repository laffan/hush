<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hush — Dropbox Authorization</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .card {
      text-align: center;
      padding: 40px;
      border-radius: 12px;
      background: #16213e;
      max-width: 400px;
    }
    h1 { font-size: 1.4em; margin: 0 0 12px; }
    p { opacity: 0.7; margin: 0; line-height: 1.5; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Connecting to Dropbox...</h1>
    <p id="message">Please wait while we complete the authorization.</p>
  </div>
  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const titleEl = document.getElementById("title");
    const msgEl = document.getElementById("message");

    if (error) {
      titleEl.textContent = "Authorization Failed";
      msgEl.textContent = error === "access_denied"
        ? "You declined the Dropbox authorization. You can close this window."
        : `Error: ${error}. You can close this window.`;
      msgEl.classList.add("error");
    } else if (code) {
      // Store the code so the Hush settings window can pick it up
      localStorage.setItem("hush_oauth_code", code);
      titleEl.textContent = "Connected!";
      msgEl.textContent = "You can close this window and return to Hush.";
    } else {
      titleEl.textContent = "No Authorization Code";
      msgEl.textContent = "Something went wrong. Please try again from Hush settings.";
      msgEl.classList.add("error");
    }
  </script>
</body>
</html>
