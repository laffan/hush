# XcodeGen spec for the macOS build of the widget extension. The desktop
# app is a plain cargo/Tauri bundle with no Xcode project, so the
# extension is built on its own here and copied into the bundle's
# PlugIns folder by scripts/macos-build-widgets.sh, which also supplies
# the environment variables below. Not meant to be generated by hand.
#
#   HUSH_TEAM_ID           your Apple Developer team ID
#   HUSH_MACOS_APP_GROUP   <team ID>.com.hushwriter.app — macOS wants an
#                          App Group prefixed with the signing team's ID
#   HUSH_BUNDLE_ID         the app's identifier (tauri.conf.json)
#   HUSH_VERSION           the app's version (tauri.conf.json)
#   HUSH_SIGN_IDENTITY     codesigning identity for the extension
name: HushWidgetsMac
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  HushWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: ../Sources
    info:
      path: build/HushWidgets-Info.plist
      properties:
        CFBundleDisplayName: Hush
        CFBundleShortVersionString: ${HUSH_VERSION}
        CFBundleVersion: ${HUSH_VERSION}
        HushAppGroup: ${HUSH_MACOS_APP_GROUP}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: build/HushWidgets.entitlements
      properties:
        # Every app extension on macOS runs sandboxed.
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - ${HUSH_MACOS_APP_GROUP}
    settings:
      base:
        PRODUCT_NAME: HushWidgets
        PRODUCT_BUNDLE_IDENTIFIER: ${HUSH_BUNDLE_ID}.widgets
        DEVELOPMENT_TEAM: ${HUSH_TEAM_ID}
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ${HUSH_SIGN_IDENTITY}
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
